name: 发布容器镜像

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本（例如 v1.2.3）"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: 校验发布版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        name: 校验 SemVer
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="$REF_NAME"
          fi
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "版本必须符合 vMAJOR.MINOR.PATCH 或合法预发布 SemVer" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$version"; then
            tag_sha="$(git rev-list -n 1 "$version")"
            if [[ "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "现有版本标签指向其他提交，拒绝覆盖不可变发布" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    name: 发布前完整质量门
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    name: 构建并签名 ${{ matrix.target }}
    needs: [validate, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            image: ghcr.io/${{ github.repository }}-api
          - target: worker
            image: ghcr.io/${{ github.repository }}-worker
          - target: web
            image: ghcr.io/${{ github.repository }}-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - id: build
        name: 构建并推送多架构镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.target }}
          provenance: mode=max
          sbom: true
      - name: 生成可下载的 SPDX JSON SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.target }}.spdx.json
          upload-artifact: false
      - name: 证明构建来源
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: 证明 SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom-${{ matrix.target }}.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@v4.1.2
      - name: 使用 GitHub OIDC 无密钥签名
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: 记录不可变镜像引用
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.target }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > "image-$TARGET.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            sbom-${{ matrix.target }}.spdx.json
            image-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: 创建 GitHub Release
    needs: [validate, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true
      - name: 生成附件校验和
        run: sha256sum release-artifacts/* > release-artifacts/SHA256SUMS
      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_VERSION" --repo "$REPOSITORY" >/dev/null 2>&1; then
            if [[ "$RELEASE_REF_TYPE" == "tag" ]]; then
              gh release create "$RELEASE_VERSION" --repo "$REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_VERSION"
            else
              gh release create "$RELEASE_VERSION" --repo "$REPOSITORY" --target "$RELEASE_SHA" --generate-notes --title "$RELEASE_VERSION"
            fi
          fi
          gh release upload "$RELEASE_VERSION" release-artifacts/* --repo "$REPOSITORY" --clobber
