name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          enable-cache: true
          python-version: "3.12"
      - run: uv lock --check
      - run: uv sync --frozen
      - name: 检查 OpenAPI 契约是否已同步
        run: >-
          uv run python -m cnb_api.openapi --output apps/web/openapi.json
          && git diff --exit-code -- apps/web/openapi.json
      - run: uv run poe check
      - run: uv run alembic heads
      - run: uv build --all-packages --out-dir dist

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "12.3.4"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 检查 TypeScript API 客户端是否已同步
        run: >-
          pnpm --filter @cnb/web generate:api
          && git diff --exit-code -- apps/web/src/api-client/generated
      - run: pnpm --filter @cnb/web check
      - run: pnpm --filter @cnb/web exec playwright install --with-deps chromium
      - run: pnpm --filter @cnb/web test:e2e

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          enable-cache: true
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.3.4"
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen --with pip-audit pip-audit --skip-editable
      - run: pnpm audit --prod --audit-level high

  containers:
    needs: [backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - name: 检查 Dockerfile 规范
        if: matrix.target == 'api'
        run: docker run --rm -i hadolint/hadolint:v2.12.0-alpine < Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: cyber-netizen-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: false
      - name: 扫描高危与严重镜像漏洞
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cyber-netizen-${{ matrix.target }}:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: 生成 SPDX JSON SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: cyber-netizen-${{ matrix.target }}:ci
          format: spdx-json
          output-file: sbom-${{ matrix.target }}.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: ci-sbom-${{ matrix.target }}
          path: sbom-${{ matrix.target }}.spdx.json
          if-no-files-found: error
          retention-days: 14

  infrastructure-acceptance:
    needs: [backend, web]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 执行 Compose 与隔离恢复验收
        shell: pwsh
        run: >-
          ./scripts/verify-infrastructure.ps1
          -EvidencePath "$env:RUNNER_TEMP/infrastructure-acceptance.json"
      - name: 保存脱敏验收证据
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-acceptance-evidence
          path: ${{ runner.temp }}/infrastructure-acceptance.json
          if-no-files-found: error
          retention-days: 14
