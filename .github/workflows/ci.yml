name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run poe check
      - run: uv run alembic heads

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: "12.3.4"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cnb/web check
      - run: pnpm --filter @cnb/web exec playwright install --with-deps chromium
      - run: pnpm --filter @cnb/web test:e2e
