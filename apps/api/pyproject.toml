[project]
name = "cnb-api"
version = "0.1.0"
description = "基于 FastAPI 的管理与消息网关"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cnb-adapters",
  "cnb-application",
  "cnb-contracts",
  "cnb-infrastructure",
  "fastapi>=0.116,<1",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "uvicorn[standard]>=0.35,<1",
]

[tool.uv.sources]
cnb-adapters = { workspace = true }
cnb-application = { workspace = true }
cnb-contracts = { workspace = true }
cnb-infrastructure = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnb_api"]
