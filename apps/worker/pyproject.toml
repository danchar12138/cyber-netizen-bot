[project]
name = "cnb-worker"
version = "0.1.0"
description = "赛博网友机器人的 Dramatiq Worker 进程"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cnb-application",
  "cnb-infrastructure",
  "dramatiq[redis]>=1.18,<2",
]

[tool.uv.sources]
cnb-application = { workspace = true }
cnb-infrastructure = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnb_worker"]
