[project]
name = "cnb-infrastructure"
version = "0.1.0"
description = "赛博网友机器人的基础设施适配器"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "cnb-application",
  "cnb-contracts",
  "cnb-domain",
  "cryptography>=50,<51",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=6.4,<9",
  "sqlalchemy>=2.0.43,<3",
  "openai>=2,<3",
  "minio>=7.2,<8",
  "pgvector>=0.4,<1",
  "PyJWT[crypto]>=2.10,<3",
  "pillow>=11,<13",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0,<1",
]

[tool.uv.sources]
cnb-application = { workspace = true }
cnb-contracts = { workspace = true }
cnb-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnb_infrastructure"]
