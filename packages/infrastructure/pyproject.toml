[project]
name = "cnb-infrastructure"
version = "0.1.0"
description = "Infrastructure adapters for Cyber Netizen Bot"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=6.4,<7",
  "sqlalchemy>=2.0.43,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnb_infrastructure"]

