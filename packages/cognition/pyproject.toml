[project]
name = "cnb-cognition"
version = "0.1.0"
description = "与框架无关的认知运行时接口"
requires-python = ">=3.12,<3.14"
dependencies = ["cnb-domain"]

[tool.uv.sources]
cnb-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnb_cognition"]
