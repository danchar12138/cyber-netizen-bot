[project]
name = "cnb-adapters"
version = "0.1.0"
description = "渠道 Adapter 契约与平台实现"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cnb-domain",
  "httpx>=0.28,<1",
]

[tool.uv.sources]
cnb-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnb_adapters"]
