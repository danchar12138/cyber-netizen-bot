[project]
name = "cnb-contracts"
version = "0.1.0"
description = "赛博网友机器人的版本化 API 与事件契约"
requires-python = ">=3.12,<3.14"
dependencies = [
  "cnb-domain",
  "pydantic>=2.11,<3",
]

[tool.uv.sources]
cnb-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnb_contracts"]
